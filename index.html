<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-dark: #7c3aed;
            --primary-light: #a78bfa;
            --secondary: #10b981;
            --danger: #ef4444;
            --background: #0f172a;
            --surface: #1e293b;
            --surface-light: #334155;
            --text: #f1f5f9;
            --text-light: #cbd5e1;
            --border: #334155;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            --gradient: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .app-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .header p {
            font-size: 1.1rem;
            color: var(--text-light);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Main Content */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
        }

        /* Chat Container */
        .chat-container {
            background: var(--surface);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 400px;
            max-height: 500px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px 5px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chat-message {
            padding: 12px 16px;
            border-radius: 16px;
            max-width: 85%;
            animation: slideIn 0.3s ease;
        }

        .user-message {
            background: var(--gradient);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
        }

        .ai-message {
            background: var(--surface-light);
            color: var(--text);
            align-self: flex-start;
            border-bottom-left-radius: 6px;
        }

        .message-content {
            line-height: 1.5;
        }

        .message-actions {
            margin-top: 8px;
            display: flex;
            gap: 8px;
        }

        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 12px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
        }

        .speak-btn {
            background: var(--primary);
            color: white;
        }

        .speak-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .speak-btn.speaking {
            background: var(--danger);
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--surface-light);
            border-radius: 16px;
            align-self: flex-start;
            border-bottom-left-radius: 6px;
            animation: pulse 1.5s infinite;
        }

        .typing-dots {
            display: flex;
            gap: 5px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-light);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        /* Input Area */
        .input-area {
            background: var(--surface);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .input-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            background: var(--surface-light);
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn.active {
            background: var(--gradient);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .text-input-container {
            display: flex;
            gap: 10px;
        }

        .text-input {
            flex: 1;
            padding: 15px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            resize: none;
            min-height: 80px;
            background: var(--surface-light);
            color: var(--text);
            font-family: inherit;
        }

        .text-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .send-btn {
            padding: 15px 25px;
            border: none;
            border-radius: 12px;
            background: var(--gradient);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(139, 92, 246, 0.4);
        }

        .voice-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: var(--gradient);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .voice-btn.recording {
            background: #ef4444;
            animation: pulse 2s infinite;
        }

        .file-input-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: inline-block;
            padding: 15px;
            background: var(--surface-light);
            color: var(--text);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            text-align: center;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 2px dashed var(--border);
        }

        .file-input-label:hover {
            border-color: var(--primary);
        }

        .image-preview {
            margin-top: 10px;
            text-align: center;
        }

        .image-preview img {
            max-width: 100%;
            max-height: 150px;
            border-radius: 12px;
            border: 2px solid var(--border);
        }

        /* Session Bar */
        .session-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--surface);
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .session-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .session-status {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .session-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            padding: 10px 15px;
            border: none;
            border-radius: 12px;
            background: var(--surface-light);
            color: var(--text);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .icon-btn:hover {
            background: var(--primary);
            color: white;
        }

        /* Animations */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }

        /* Scrollbar Styling */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: var(--surface-light);
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 3px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .app-container {
                padding: 15px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .text-input-container {
                flex-direction: column;
            }

            .chat-message {
                max-width: 90%;
            }

            .session-bar {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }

            .session-actions {
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <h1><i class="fas fa-robot"></i> AI Assistant</h1>
            <p>Chat with text, voice, or images. I remember our conversation.</p>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Session Bar -->
            <div class="session-bar">
                <div class="session-info">
                    <div class="session-status">
                        <i class="fas fa-circle"></i>
                        Active Session
                    </div>
                </div>
                <div class="session-actions">
                    <button class="icon-btn" onclick="startNewSession()">
                        <i class="fas fa-plus"></i>
                        New
                    </button>
                    <button class="icon-btn" onclick="clearChat()">
                        <i class="fas fa-trash"></i>
                        Clear
                    </button>
                </div>
            </div>

            <!-- Chat Container -->
            <div class="chat-container">
                <div class="chat-messages" id="chatMessages">
                    <div class="chat-message ai-message">
                        <div class="message-content">
                            Hello! I'm your AI assistant. You can chat with me using text, voice, or by uploading images. How can I help you today?
                        </div>
                        <div class="message-actions">
                            <button class="action-btn speak-btn" onclick="toggleSpeech(this, 'Hello! I am your AI assistant. You can chat with me using text, voice, or by uploading images. How can I help you today?')">
                                <i class="fas fa-volume-up"></i> Speak
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-tabs">
                    <button class="tab-btn active" data-tab="text">
                        <i class="fas fa-comment"></i>
                        Text
                    </button>
                    <button class="tab-btn" data-tab="voice">
                        <i class="fas fa-microphone"></i>
                        Voice
                    </button>
                    <button class="tab-btn" data-tab="image">
                        <i class="fas fa-image"></i>
                        Image
                    </button>
                </div>

                <!-- Text Tab -->
                <div class="tab-content active" id="text-tab">
                    <div class="text-input-container">
                        <textarea 
                            id="textInput" 
                            class="text-input" 
                            placeholder="Type your message here... (Press Enter to send, Shift+Enter for new line)"
                        ></textarea>
                        <button class="send-btn" onclick="sendText()">
                            <i class="fas fa-paper-plane"></i>
                            Send
                        </button>
                    </div>
                </div>

                <!-- Voice Tab -->
                <div class="tab-content" id="voice-tab">
                    <button id="voiceBtn" class="voice-btn">
                        <i class="fas fa-microphone"></i>
                        Press to Record
                    </button>
                </div>

                <!-- Image Tab -->
                <div class="tab-content" id="image-tab">
                    <div class="file-input-container">
                        <div class="file-input-wrapper">
                            <input type="file" id="imageInput" class="file-input" accept="image/*">
                            <label for="imageInput" class="file-input-label">
                                <i class="fas fa-folder-open"></i>
                                Choose Image
                            </label>
                        </div>
                        <button class="send-btn" onclick="uploadImage()">
                            <i class="fas fa-search"></i>
                            Analyze Image
                        </button>
                        <div id="imagePreview" class="image-preview"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        // Global variables for speech control
        let currentAudio = null;
        let currentSpeakingButton = null;

        // Tab switching functionality
        document.querySelectorAll('.tab-btn').forEach(button => {
            button.addEventListener('click', () => {
                // Remove active class from all tabs and contents
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
                
                // Add active class to clicked tab
                button.classList.add('active');
                
                // Show corresponding content
                const tabId = button.getAttribute('data-tab');
                document.getElementById(`${tabId}-tab`).classList.add('active');
            });
        });

        // Get conversation ID from Django template
        const conversationId = "{{ conversation_id }}";
        let currentSessionId = "{{ session_id }}";
        
        // Get CSRF token from the page
        function getCSRFToken() {
            const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]');
            return csrfToken ? csrfToken.value : '';
        }

        // Configure axios defaults with CSRF token
        axios.defaults.xsrfHeaderName = "X-CSRFToken";
        axios.defaults.xsrfCookieName = "csrftoken";

        // Speech control function
        function toggleSpeech(button, text) {
            // If this button is already speaking, stop it
            if (button.classList.contains('speaking')) {
                stopSpeech();
                return;
            }

            // If another button is speaking, stop it first
            if (currentSpeakingButton && currentSpeakingButton !== button) {
                stopSpeech();
            }

            // Start speaking the new text
            speakText(button, text);
        }

        function stopSpeech() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            
            if (currentSpeakingButton) {
                currentSpeakingButton.innerHTML = '<i class="fas fa-volume-up"></i> Speak';
                currentSpeakingButton.classList.remove('speaking');
                currentSpeakingButton = null;
            }
        }

        // TTS Function
        async function speakText(button, text) {
            try {
                // Stop any current speech
                stopSpeech();
                
                // Set current speaking button
                currentSpeakingButton = button;
                button.innerHTML = '<i class="fas fa-stop"></i> Stop';
                button.classList.add('speaking');

                const response = await axios.post('/api/text-to-speech/', {
                    text: text
                }, {
                    responseType: 'blob',
                    headers: {
                        'X-CSRFToken': getCSRFToken(),
                        'Content-Type': 'application/json'
                    }
                });
                
                const audioUrl = URL.createObjectURL(response.data);
                currentAudio = new Audio(audioUrl);
                
                currentAudio.onended = function() {
                    stopSpeech();
                };
                
                currentAudio.onerror = function() {
                    stopSpeech();
                    alert('Error playing audio.');
                };
                
                currentAudio.play();
                
            } catch (error) {
                console.error('TTS Error:', error);
                stopSpeech();
                alert('Text-to-speech is not available right now.');
            }
        }

        // Session Management Functions
        async function startNewSession() {
            try {
                const response = await axios.post('/api/start-new-session/', {
                    conversation_id: conversationId
                }, {
                    headers: {
                        'X-CSRFToken': getCSRFToken(),
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.data.status === 'success') {
                    currentSessionId = response.data.session_id;
                    
                    // Clear chat container and show new session message
                    const chatMessages = document.getElementById('chatMessages');
                    chatMessages.innerHTML = `
                        <div class="chat-message ai-message">
                            <div class="message-content">
                                🆕 New session started! How can I help you?
                            </div>
                            <div class="message-actions">
                                <button class="action-btn speak-btn" onclick="toggleSpeech(this, 'New session started! How can I help you?')">
                                    <i class="fas fa-volume-up"></i> Speak
                                </button>
                            </div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error starting new session:', error);
                alert('Error starting new session. Please try again.');
            }
        }

        // Clear chat function
        function clearChat() {
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = `
                <div class="chat-message ai-message">
                    <div class="message-content">
                        Chat cleared! What would you like to talk about?
                    </div>
                    <div class="message-actions">
                        <button class="action-btn speak-btn" onclick="toggleSpeech(this, 'Chat cleared! What would you like to talk about?')">
                            <i class="fas fa-volume-up"></i> Speak
                        </button>
                    </div>
                </div>
            `;
        }

        // Display message in chat
        function displayMessage(message, isUser) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-message ${isUser ? 'user-message' : 'ai-message'}`;
            
            let messageHTML = `
                <div class="message-content">${message}</div>
            `;
            
            // Add speak button for AI messages
            if (!isUser) {
                const escapedMessage = message.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                messageHTML += `
                    <div class="message-actions">
                        <button class="action-btn speak-btn" onclick="toggleSpeech(this, '${escapedMessage}')">
                            <i class="fas fa-volume-up"></i> Speak
                        </button>
                    </div>
                `;
            }
            
            messageDiv.innerHTML = messageHTML;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Show typing indicator
        function showTypingIndicator() {
            const chatMessages = document.getElementById('chatMessages');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.innerHTML = `
                <strong>AI Assistant</strong>
                <div class="typing-dots">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function hideTypingIndicator() {
            const typingIndicator = document.querySelector('.typing-indicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        // Text Input Function
        async function sendText() {
            const textInput = document.getElementById('textInput');
            const text = textInput.value.trim();
            
            if (!text) {
                alert('Please enter some text');
                return;
            }

            // Display user message
            displayMessage(text, true);
            textInput.value = '';

            // Show typing indicator
            showTypingIndicator();

            try {
                const response = await axios.post('/api/process-text/', {
                    text: text,
                    conversation_id: conversationId
                }, {
                    headers: {
                        'X-CSRFToken': getCSRFToken(),
                        'Content-Type': 'application/json'
                    }
                });
                
                // Hide typing indicator and display AI response
                hideTypingIndicator();
                displayMessage(response.data.response, false);
                
            } catch (error) {
                console.error('Error sending text:', error);
                hideTypingIndicator();
                displayMessage('❌ Error: Could not process your message', false);
            }
        }

        // Image Upload Function
        async function uploadImage() {
            const fileInput = document.getElementById('imageInput');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select an image file');
                return;
            }

            // Preview image
            const preview = document.getElementById('imagePreview');
            preview.innerHTML = `<img src="${URL.createObjectURL(file)}">`;

            // Create FormData for file upload
            const formData = new FormData();
            formData.append('image', file);
            formData.append('conversation_id', conversationId);

            try {
                displayMessage(`📷 Uploading image...`, true);
                
                const response = await axios.post('/api/process-image/', formData, {
                    headers: {
                        'X-CSRFToken': getCSRFToken(),
                        'Content-Type': 'multipart/form-data'
                    }
                });
                
                if (response.data.status === 'success') {
                    // Display image caption
                    displayMessage(`📷 ${response.data.caption}`, true);
                    
                    // Show typing for AI analysis
                    showTypingIndicator();
                    setTimeout(() => {
                        hideTypingIndicator();
                        displayMessage(response.data.ai_response, false);
                    }, 1000);
                    
                } else {
                    throw new Error(response.data.message);
                }
            } catch (error) {
                console.error('Error uploading image:', error);
                displayMessage('❌ Error processing image', false);
            }
        }

        // Allow Enter key for text input (but allow Shift+Enter for new line)
        document.getElementById('textInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendText();
            }
        });

        // Voice Recording Functions
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        const voiceBtn = document.getElementById('voiceBtn');
        
        voiceBtn.addEventListener('click', toggleRecording);

        function toggleRecording() {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        channelCount: 1,
                        sampleRate: 16000,
                        sampleSize: 16,
                        echoCancellation: true,
                        noiseSuppression: true
                    } 
                });
                
                const options = { mimeType: 'audio/webm; codecs=opus' };
                mediaRecorder = new MediaRecorder(stream, options);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    await sendAudioToServer(audioBlob);
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                isRecording = true;
                
                voiceBtn.innerHTML = '<i class="fas fa-stop"></i> Stop Recording';
                voiceBtn.classList.add('recording');
                
            } catch (error) {
                console.error('Error starting recording:', error);
                alert('Error accessing microphone. Please check permissions.');
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                
                voiceBtn.innerHTML = '<i class="fas fa-microphone"></i> Press to Record';
                voiceBtn.classList.remove('recording');
            }
        }

        async function sendAudioToServer(audioBlob) {
            const formData = new FormData();
            
            const fileExtension = audioBlob.type.includes('webm') ? 'webm' : 'wav';
            formData.append('audio', audioBlob, `recording.${fileExtension}`);
            formData.append('conversation_id', conversationId);

            try {
                displayMessage(`🎤 Processing voice...`, true);
                
                const response = await axios.post('/api/process-voice/', formData, {
                    headers: {
                        'X-CSRFToken': getCSRFToken(),
                        'Content-Type': 'multipart/form-data'
                    }
                });

                if (response.data.status === 'success') {
                    // Display user's transcribed voice message
                    displayMessage(`🎤 ${response.data.text}`, true);
                    
                    // Show typing for AI response
                    showTypingIndicator();
                    setTimeout(() => {
                        hideTypingIndicator();
                        displayMessage(response.data.ai_response, false);
                    }, 1500);
                    
                } else {
                    throw new Error(response.data.message);
                }
            } catch (error) {
                console.error('Error sending audio:', error);
                displayMessage('❌ Error processing voice recording', true);
            }
        }
    </script>
</body>
</html>
